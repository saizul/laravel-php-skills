name: Bug report
description: A script crashed, reported a wrong finding, or a skill gave unsafe or wrong advice
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste secrets: .env values, APP_KEY, tokens, queue payloads or customer data.**
        Reduce wrong findings to a minimal PHP/Blade snippet.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - laravel-security-review
        - eloquent-n-plus-one
        - laravel-migrations-safety
        - laravel-queues-horizon
        - laravel-testing
        - php-static-analysis
        - laravel-performance
        - laravel-deploy-vps
        - validator / repository tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, its output, and (for wrong findings) a minimal redacted input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Laravel 11.30, PHP 8.3, Python 3.12, Claude Code / Codex CLI"
    validations:
      required: true
